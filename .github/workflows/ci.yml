name: CampusConnect Continuous Integration & Delivery

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # -----------------------------------------------------------------
  # 1. FRONTEND CI: LINT, TEST, AND BUILD
  # -----------------------------------------------------------------
  frontend-ci:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Frontend Application
        run: npm run build

  # -----------------------------------------------------------------
  # 2. BACKEND MICROSERVICES CI: TEST & PACKAGE
  # -----------------------------------------------------------------
  backend-ci:
    name: Backend Microservices Test & Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Backend Tests (JUnit 5 & Mockito)
        run: mvn clean test

      - name: Package Microservice JARs
        run: mvn package -DskipTests

  # -----------------------------------------------------------------
  # 3. DOCKER BUILD VERIFICATION
  # -----------------------------------------------------------------
  docker-build:
    name: Docker Image Build Validation
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config
