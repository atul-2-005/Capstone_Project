version: '3.8'

services:
  # -------------------------------------------------------------
  # INFRASTRUCTURE DATABASES & CACHE
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: campusconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusconnect}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campusconnect-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: campusconnect-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campusconnect-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: campusconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campusconnect-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # DISCOVERY SERVER & GATEWAY
  # -------------------------------------------------------------
  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    container_name: campusconnect-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=discovery-server
    networks:
      - campusconnect-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: campusconnect-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-CampusConnectSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - campusconnect-net

  # -------------------------------------------------------------
  # BACKEND MICROSERVICES
  # -------------------------------------------------------------
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: campusconnect-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campusconnect_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-CampusConnectSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - campusconnect-net

  request-service:
    build:
      context: ./backend/request-service
      dockerfile: Dockerfile
    container_name: campusconnect-request-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campusconnect_request?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/campusconnect_requests
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-CampusConnectSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - campusconnect-net

  booking-service:
    build:
      context: ./backend/booking-service
      dockerfile: Dockerfile
    container_name: campusconnect-booking-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campusconnect_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-CampusConnectSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - campusconnect-net

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: campusconnect-notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/campusconnect_notifications
      - EUREKA_URI=http://discovery-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-CampusConnectSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - campusconnect-net

  # -------------------------------------------------------------
  # FRONTEND CLIENT
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - campusconnect-net

networks:
  campusconnect-net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
